name: Generate Contribution Pipeline

on:
  schedule:
    - cron: "30 0 * * 0" # after the lines-of-code job, so the two pushes do not race
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OWNER: ${{ github.repository_owner }}
      OWNER_ID: ${{ github.repository_owner_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f login="$OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { contributionLevel contributionCount weekday date } }
                  }
                }
              }
            }' > "$RUNNER_TEMP/calendar.json"

      - name: Generate pipeline SVG
        run: python3 scripts/pipeline_svg.py "$RUNNER_TEMP/calendar.json" dist/github-pipeline.svg

      - name: Commit and push
        run: |
          git config user.name "$OWNER"
          git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
          git add dist/github-pipeline.svg
          git diff --cached --quiet || git commit -m "chore: update contribution pipeline"
          git push
